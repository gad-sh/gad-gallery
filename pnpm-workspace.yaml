# The showcase and the kit's packages (a private clone in kit/, see scripts/setup-kit.sh)
# install as one workspace, so there's a single Svelte and a single A-Frame.
packages:
  - .
  - kit/packages/*
# A-Frame 1.8 installs one of its own dependencies (three-bmfont-text) from git.
blockExoticSubdeps: false
